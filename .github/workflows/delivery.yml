name: Publish Docker Image

on:
  push:
    branches:
      - master   # Run workflow when pushing to master

jobs:
  deliveryToDocker:
    name: Build & Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js (optional — if you need to build before Docker)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies and build Vite app (optional)
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 4️⃣ Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5️⃣ Extract metadata for tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: rajib700/cicd
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      # 6️⃣ Build and push Docker image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 7️⃣ Confirmation message
      - name: Success Message
        run: echo "✅ Docker image built and pushed successfully!"
